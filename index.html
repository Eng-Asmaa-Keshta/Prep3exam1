<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,#1d1145 0,transparent 60%),radial-gradient(700px 400px at 0 100%,#062b3a 0,transparent 60%),var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

h1{font-size:30px;margin:8px 0;text-align:center;font-family:Consolas,monospace;letter-spacing:1px;background:linear-gradient(90deg,var(--c),var(--g),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}

textarea{min-height:190px;direction:ltr;text-align:left;line-height:1.6;resize:vertical}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:700;color:#04110a;background:linear-gradient(90deg,var(--g),var(--c));cursor:pointer;font-family:inherit}

.top{position:sticky;top:0;z-index:5;background:rgba(6,8,15,.92);backdrop-filter:blur(8px);padding:8px 0 6px;margin:-12px -14px 8px;padding-inline:14px;border-bottom:1px solid var(--line)}

.op b{min-width:26px;height:26px;border-radius:8px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:14px}
.op.on{border-color:var(--c);background:#0b2a3a;box-shadow:0 0 14px rgba(34,211,238,.35)}.op.on b{background:var(--c);color:#041018}
.tf{display:flex;gap:10px}.tf .op{justify-content:center;font-size:22px;font-weight:800;padding:20px;direction:rtl}

.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pc{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#0a1020;text-align:center;font-weight:700;cursor:pointer;color:var(--tx)}

.pop{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:15;font-weight:800;color:var(--y);animation:up 1s forwards;pointer-events:none;font-size:20px}

.ans{direction:ltr;text-align:left;white-space:pre-wrap;background:#060b16;border-radius:8px;padding:8px;margin:6px 0;font-size:14px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}

T.forEach((b,l)=>shuf(b.map((_,i)=>i)).slice(0,2).forEach(i=>qs.push({t:"t",l,i})));
qs.push({t:"e",i:Math.random()<.5?0:1},{t:"e",i:Math.random()<.5?2:3});return qs}
const get=q=>q.t==="m"?M[q.l][q.i]:q.t==="t"?T[q.l][q.i]:E[q.i];
const STG={m:["المرحلة 1","MCQ ⚡"],t:["المرحلة 2","صح أو غلط 🎯"],e:["المرحلة 3 • BOSS","Essay 👑"]};
const RANK=[[0,"🥉 Rookie"],[25,"🥈 Coder"],[50,"🥇 Hacker"],[75,"💎 Elite"],[95,"👑 Legend"]];
function home(){const old=load();$("#app").innerHTML=`<h1>ICT EXAM ARENA</h1><div class="sub">الصف الثالث الإعدادي • ICT • الترم الأول<br>الوحدة الأولى كاملة + الدرس الأول والتاني من الوحدة التانية</div>
<div class="card"><input id="nm" maxlength="40" placeholder="اكتب اسمك بالكامل" value="${old&&old.done?"":esc((old&&old.name)||"")}">
<div class="sub" style="margin:8px 0">📝 35 سؤال (MCQ + صح/غلط) + سؤالين Essay<br>⏱ 45 دقيقة بتايمر واحد للامتحان كله<br>🎮 3 مراحل • اكسب XP وارتقي في الرانك<br>📩 نتيجتك بتتبعت للمدرّسة أوتوماتيك في الآخر<br>✅ التصحيح التفصيلي بيظهر بعد التسليم</div>
<button class="btn" id="go">ابدأ الامتحان 🚀</button></div>
${old&&!old.done?`<button class="btn alt" id="rs">⏩ كمّل الامتحان اللي كنت بتحله (${esc(old.name)})</button>`:""}`;
$("#go").onclick=()=>{const n=$("#nm").value.trim();if(n.length<3)return alert("اكتب اسمك بالكامل الأول");S={name:n,qs:build(),a:{},f:{},cur:0,xp:0,start:Date.now(),end:Date.now()+CFG.min*60000,done:false};save();run()};
if(old&&!old.done)$("#rs").onclick=()=>{S=old;run()}}
function run(){tick();clearInterval(tm);tm=setInterval(tick,500);draw();banner()}
function tick(){const left=S.end-Date.now();if(left<=0&&!S.done){return finish(true)}const t=$("#tm");if(!t)return;const s=Math.max(0,left/1000|0);t.textContent=`${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;t.classList.toggle("low",s<300);$("#tb").style.width=Math.max(0,left/(CFG.min*600))+"%"}
const prog=()=>Object.keys(S.a).filter(k=>S.a[k]!==undefined&&S.a[k]!==""&&(S.qs[k].t!=="e"||String(S.a[k]).trim().split(/\s+/).length>=5)).length;
function rank(){const p=prog()/S.qs.length*100;let r=RANK[0][1];RANK.forEach(x=>{if(p>=x[0])r=x[1]});return r}
function draw(){const q=S.qs[S.cur],d=get(q),k=S.cur,st=STG[q.t];let body="";
if(q.t==="m"){const [tx,code]=d[0].split("||");body=`<div class="q">${esc(tx)}</div>${code?`<pre>${esc(code)}</pre>`:""}`+q.o.map((oi,pos)=>`<button class="op ${S.a[k]===oi?"on":""}" onclick="pick(${oi})"><b>${"ABCD"[pos]}</b><span>${esc(d[1][oi])}</span></button>`).join("")}
else if(q.t==="t"){body=`<div class="q">${esc(d[0])}</div><div class="tf"><button class="op t ${S.a[k]===true?"on t":""}" onclick="pick(true)">✓ True</button><button class="op f ${S.a[k]===false?"on f":""}" onclick="pick(false)">✗ False</button></div>`}
else{body=`<div class="q">${esc(d[0])}</div><textarea id="es" placeholder="Write your answer here…" oninput="ess(this.value)">${esc(S.a[k]||"")}</textarea><div class="sub" id="wc"></div>`}
const last=k===S.qs.length-1;
$("#app").innerHTML=`<div class="top"><div class="hud"><span class="chip tm" id="tm">--:--</span><span class="chip">${rank()}</span><span class="chip">⚡ ${S.xp} XP</span></div><div class="bar"><i id="tb" style="width:100%"></i></div></div>
<div class="hud"><span class="stg">${st[0]} • ${st[1]}</span><span class="chip">${k+1} / ${S.qs.length}</span></div>
<div class="bar"><i id="xb" style="width:${prog()/S.qs.length*100}%"></i></div>
<div class="card"><div class="hud"><small style="color:var(--mut)">${q.t==="e"?"Essay • 5 درجات":LN[q.l]}</small><button class="chip" style="color:${S.f[k]?"var(--y)":"var(--mut)"}" onclick="flag()">🚩 ${S.f[k]?"متعلّم":"علّم"}</button></div>${body}</div>
<div class="nav"><button class="btn alt" onclick="mv(-1)" ${k?"":"disabled"}>→ السابق</button><button class="btn alt" onclick="pal()">🗂 الأسئلة</button>${last?`<button class="btn red" onclick="ask()">تسليم 🏁</button>`:`<button class="btn" onclick="mv(1)">التالي ←</button>`}</div>`;
tick();if(q.t==="e")ess(S.a[k]||"",1)}
function pick(v){const k=S.cur;if(S.a[k]===undefined){S.xp+=10;pop("+10 XP")}S.a[k]=v;save();draw()}
function ess(v,nox){const k=S.cur,n=v.trim()?v.trim().split(/\s+/).length:0;const was=(S.a[k]||"").trim().split(/\s+/).length>=20;S.a[k]=v;if(!was&&n>=20&&!nox){S.xp+=30;pop("+30 XP 👑")}const w=$("#wc");if(w)w.textContent=n+" كلمة";save()}
function flag(){S.f[S.cur]=!S.f[S.cur];save();draw()}
function mv(d){const o=S.qs[S.cur].t;S.cur=Math.max(0,Math.min(S.qs.length-1,S.cur+d));save();draw();if(S.qs[S.cur].t!==o)banner();scrollTo(0,0)}
function banner(){const t=STG[S.qs[S.cur].t],d=document.createElement("div");d.className="stage";d.innerHTML=`<h1>${t[0]}</h1><div class="sub" style="font-size:24px">${t[1]}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function pop(t){const d=document.createElement("div");d.className="pop";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000);try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
function pal(){const o=document.createElement("div");o.className="ov";o.id="pv";o.innerHTML=`<h1>🗂 خريطة الأسئلة</h1><div class="sub">أخضر = اتجاوب • أصفر = متعلّم</div><div class="pal">${S.qs.map((q,i)=>`<div class="pc ${S.a[i]!==undefined&&S.a[i]!==""?"a":""} ${S.f[i]?"f":""} ${i===S.cur?"cu":""}" onclick="jump(${i})">${i+1}</div>`).join("")}</div><button class="btn alt" style="margin-top:14px" onclick="$('#pv').remove()">رجوع</button>`;document.body.appendChild(o)}
function jump(i){$("#pv").remove();const o=S.qs[S.cur].t;S.cur=i;save();draw();if(S.qs[i].t!==o)banner()}
function ask(){const un=S.qs.length-prog();const o=document.createElement("div");o.className="ov";o.id="pv";o.innerHTML=`<h1>تسليم الامتحان؟</h1><div class="sub">${un?`فيه <span class="tag">${un}</span> سؤال لسه متحلّش أو إجابته ناقصة.`:"كل الأسئلة اتجاوبت 👏"}<br>بعد التسليم مش هتقدر تعدّل.</div><button class="btn red" onclick="finish()">أيوه سلّم 🏁</button><button class="btn alt" style="margin-top:10px" onclick="$('#pv').remove()">لأ، كمّل</button>`;document.body.appendChild(o)}
function kwHit(a,e){return e[3].map(k=>[k[0],new RegExp(k[1],"i").test(a||"")])}
function finish(auto){clearInterval(tm);S.done=true;S.endedAt=Date.now();save();const p=$("#pv");if(p)p.remove();results(auto)}
function evalAll(){let m=0,mt=0,t=0,tt=0;const per=LN.map(()=>({c:0,n:0})),items=[];
S.qs.forEach((q,k)=>{const d=get(q),a=S.a[k];if(q.t==="e"){const h=kwHit(a,d),f=h.filter(x=>x[1]).length;items.push({k,q,d,a,h,est:Math.round(5*f/h.length*10)/10});return}
const ok=q.t==="m"?a===d[2]:a===d[1];if(q.t==="m"){mt++;if(ok)m++}else{tt++;if(ok)t++}per[q.l].n++;if(ok)per[q.l].c++;items.push({k,q,d,a,ok,sk:a===undefined})});
return{m,mt,t,tt,per,items,auto:m+t,tot:mt+tt,est:items.filter(i=>i.q.t==="e").reduce((s,i)=>s+i.est,0)}}
const optTxt=(q,d,v)=>v===undefined?"لم تجب":q.t==="m"?d[1][v]:v?"True":"False";
const corTxt=(q,d)=>q.t==="m"?d[1][d[2]]:d[1]?"True":"False";
function report(R){const mins=Math.round(((S.endedAt||Date.now())-S.start)/60000);let s=`📊 نتيجة امتحان ICT – الصف الثالث الإعدادي\nالطالب: ${S.name}\nالدرجة (MCQ + صح/غلط): ${R.auto} / ${R.tot}\nMCQ: ${R.m}/${R.mt} • صح/غلط: ${R.t}/${R.tt}\nالـ Essay: بانتظار تصحيحك (التقدير المبدئي بالكلمات المفتاحية: ${R.est.toFixed(1)} / 10)\nالزمن المستغرق: ${mins} دقيقة من ${CFG.min}\n\nالأداء لكل درس:\n`;
R.per.forEach((p,i)=>s+=`- ${LN[i]}: ${p.c}/${p.n}\n`);s+="\nالأسئلة الغلط:\n";
R.items.filter(i=>i.q.t!=="e"&&!i.ok).forEach(i=>s+=`#${i.k+1} [${LN[i.q.l]}] ${i.d[0].split("||")[0]}\n   إجابته: ${optTxt(i.q,i.d,i.a)} | الصح: ${corTxt(i.q,i.d)}\n`);
R.items.filter(i=>i.q.t==="e").forEach((i,n)=>s+=`\n✍️ Essay ${n+1}: ${i.d[0]}\nإجابة الطالب:\n${i.a||"(فاضي)"}\n`);return s}
async function send(R,box){const rep=report(R);window._rep=rep;const set=(h)=>box.innerHTML=h;if(S.sent){set(`<span style="color:var(--g)">✅ تم إرسال نتيجتك للمدرّسة</span>`);return}
if(!CFG.email||CFG.email.startsWith("PUT")){set(`<span class="tag">⚠️ لم يتم ضبط إيميل المدرّسة</span>`);return}
set("⏳ بيتبعت لمدرّسة…");
for(let a=0;a<3;a++){try{const r=await fetch("https://formsubmit.co/ajax/"+CFG.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:`ICT Exam: ${S.name} – ${R.auto}/${R.tot}`,_captcha:"false",_template:"box","الاسم":S.name,"الدرجة":R.auto+" / "+R.tot,"التقرير":rep})});const j=await r.json().catch(()=>({}));if(r.ok&&(j.success===true||j.success==="true")){set(`<span style="color:var(--g)">✅ تم إرسال نتيجتك للمدرّسة</span>`);S.sent=true;save();return}}catch(e){}await new Promise(r=>setTimeout(r,1500))}
set(`<span style="color:var(--r)">❌ الإرسال التلقائي فشل (النت؟)</span><br><small>ابعت التقرير للمدرّسة بالزرار اللي تحت</small>`)}
function results(auto){const R=evalAll(),pct=R.auto/R.tot*100,rk=RANK.slice().reverse().find(x=>pct>=x[0])[1];
$("#app").innerHTML=`<h1>${auto?"⏰ الوقت خلص!":"🏁 خلّصت الامتحان"}</h1><div class="sub">${esc(S.name)}</div>
<div class="card"><div class="big" id="bs">0</div><div class="sub" style="margin:0">من ${R.tot} (MCQ + صح/غلط) • ${rk}</div>
<div class="sub">MCQ: ${R.m}/${R.mt} • صح/غلط: ${R.t}/${R.tt}<br>الـ Essay (10 درجات) بيصحّحهم المدرّس • تقدير مبدئي: <span class="tag">${R.est.toFixed(1)}</span></div>
<div class="sub" id="st"></div></div>
<div class="card"><b>📈 أداءك في كل درس</b>${R.per.map((p,i)=>{const v=p.c/p.n*100;return `<div class="lb"><span>${LN[i]}</span><div class="bar"><i style="width:${v}%;background:${v>=80?"var(--g)":v>=50?"var(--y)":"var(--r)"}"></i></div><b>${p.c}/${p.n}</b></div>`}).join("")}
${(()=>{const w=R.per.map((p,i)=>[i,p.c/p.n]).filter(x=>x[1]<.7).map(x=>LN[x[0]]);return w.length?`<div class="sub" style="text-align:right;margin-top:10px">🎯 ركّز مراجعتك على: <span class="tag">${w.join(" • ")}</span></div>`:`<div class="sub">🔥 مستواك ممتاز في كل الدروس!</div>`})()}</div>
<div class="card"><button class="btn alt" onclick="fl('x')" id="fx">عرض الأخطاء فقط</button></div><div id="rvs"></div>
<div class="card"><button class="btn alt" onclick="wa()">📲 ابعت التقرير للمدرّسة واتساب</button><button class="btn alt" style="margin-top:8px" onclick="cp()">📋 انسخ التقرير</button><button class="btn" style="margin-top:8px" onclick="localStorage.removeItem(KEY);home()">🔄 امتحان جديد</button></div>`;
let n=0;const tg=R.auto,iv=setInterval(()=>{n+=Math.max(1,Math.ceil(tg/25));if(n>=tg){n=tg;clearInterval(iv)}$("#bs").textContent=n},40);
rv(R,false);window._R=R;send(R,$("#st"));if(pct>=70)confetti()}
function rv(R,onlyBad){$("#rvs").innerHTML=R.items.filter(i=>!onlyBad||(i.q.t!=="e"&&!i.ok)).map(i=>{const q=i.q,d=i.d;
if(q.t==="e")return `<div class="rv sk"><small>#${i.k+1} • Essay • ${i.est.toFixed(1)}/5 تقدير مبدئي (المدرّس هيصحّح)</small><div class="qq">${esc(d[0])}</div><b>إجابتك:</b><div class="ans">${esc(i.a||"(فاضي)")}</div><b>النقاط اللي المفروض تكون موجودة:</b><div>${i.h.map(x=>`<span class="kw ${x[1]?"y":"n"}">${x[1]?"✓":"✗"} ${esc(x[0])}</span>`).join("")}</div><b>الإجابة النموذجية:</b><div class="ans">${esc(d[1])}</div></div>`;
const [tx,code]=(q.t==="m"?d[0]:d[0]).split("||");return `<div class="rv ${i.sk?"sk":i.ok?"ok":"no"}"><small>#${i.k+1} • ${LN[q.l]} • ${i.ok?"✅ صح":i.sk?"⚠️ ما اتجاوبش":"❌ غلط"}</small><div class="qq">${esc(tx)}</div>${code?`<pre>${esc(code)}</pre>`:""}${i.ok?`<div>إجابتك: <b style="color:var(--g)">${esc(optTxt(q,d,i.a))}</b></div>`:`<div>إجابتك: <b style="color:var(--r)">${esc(optTxt(q,d,i.a))}</b><br>الإجابة الصحيحة: <b style="color:var(--g)">${esc(corTxt(q,d))}</b></div>`}<div class="ex">💡 ${esc(q.t==="m"?d[3]:d[2])}</div></div>`}).join("")||`<div class="sub">🎉 مفيش أخطاء!</div>`}
function fl(m){const b=$("#fx"),on=b.dataset.on!=="1";b.dataset.on=on?"1":"0";b.textContent=on?"عرض كل الأسئلة":"عرض الأخطاء فقط";rv(window._R,on)}
function wa(){window.open("https://wa.me/?text="+encodeURIComponent(window._rep.slice(0,3500)),"_blank")}
function cp(){const t=window._rep;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("اتنسخ ✅")).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");alert("اتنسخ ✅")}catch(e){}a.remove()})}
function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:3+Math.random()*5,c:["#39ff88","#22d3ee","#ffd23f","#a855f7","#ff3b5c"][Math.random()*5|0]}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(++f<260)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
window.addEventListener("beforeunload",e=>{if(S&&!S.done&&S.start){e.preventDefault();e.returnValue=""}});
(()=>{const o=load();if(o&&o.done&&o.endedAt&&Date.now()-o.endedAt<36e5){S=o;results(false)}else home()})();
</script></body></html>
